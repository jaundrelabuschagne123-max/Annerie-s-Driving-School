<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Annerie's Driving School</title>
  <meta name="description" content="Book a driving lesson with Annerie's Driving School. Call, WhatsApp or send us a message and we will call you back within one working day.">
  <meta name="theme-color" content="#D0112B">
  <meta property="og:title" content="Contact | Annerie's Driving School">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>document.documentElement.className += " js";</script>
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body data-page="contact">
  <a class="skip" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">

    <section class="page-hero">
      <div class="wrap">
        <h1 data-bind="contactPage.title">Let's get you driving</h1>
        <p class="lede" data-bind="contactPage.lead"></p>
      </div>
    </section>

    <section class="section">
      <div class="wrap contact-grid">
        <div>
          <h2 class="h3">Send us a message</h2>
          <div data-render="form"></div>
        </div>
        <aside>
          <h2 class="h3">Talk to us</h2>
          <ul class="contact-list" data-render="contactdetails"></ul>
          <div class="hours-card">
            <h3>Opening hours</h3>
            <div data-render="hours"></div>
          </div>
        </aside>
      </div>
      <div class="wrap">
        <div class="map" data-render="map"></div>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>
</body>
</html>
