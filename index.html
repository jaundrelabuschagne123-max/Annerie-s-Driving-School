<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annerie's Driving School | Driving lessons in Gauteng</title>
  <meta name="description" content="Friendly, dual-control driving lessons in Johannesburg, Ekurhuleni and Pretoria. Learner's licence prep, beginner and automatic lessons, and test-day packages.">
  <meta name="theme-color" content="#D0112B">
  <meta property="og:title" content="Annerie's Driving School">
  <meta property="og:description" content="Pass first time. Drive for life. Driving lessons across Gauteng.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>document.documentElement.className += " js";</script>
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body data-page="home">
  <a class="skip" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">

    <!-- Hero: headline rises, the car drives in, the road moves as you scroll -->
    <section class="hero">
      <div class="wrap">
        <div class="hero__top">
          <h1 class="hero__title">
            <span class="line" style="--i:0"><span data-bind="home.heroLines.0">Pass first time.</span></span>
            <span class="line line--red" style="--i:1"><span data-bind="home.heroLines.1">Drive for life.</span></span>
          </h1>
        </div>

        <div class="hero__row">
          <div class="hero__copy">
            <p class="hero__lead" data-bind="home.heroLead"></p>
            <div class="hero__cta">
              <a class="btn" href="contact.html" data-bind="home.ctaPrimary.label" data-bind-href="home.ctaPrimary.href">Book a lesson</a>
              <a class="btn btn--ghost" href="pricing.html" data-bind="home.ctaSecondary.label" data-bind-href="home.ctaSecondary.href">See our prices</a>
            </div>
            <p class="hero__proof">
              <span class="stars" role="img" aria-label="5 out of 5 stars">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21 7 14.2l-5-4.9 6.9-1z"/></svg>
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21 7 14.2l-5-4.9 6.9-1z"/></svg>
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21 7 14.2l-5-4.9 6.9-1z"/></svg>
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21 7 14.2l-5-4.9 6.9-1z"/></svg>
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21 7 14.2l-5-4.9 6.9-1z"/></svg>
              </span>
              <span data-bind="home.proof"></span>
            </p>
          </div>

          <!-- Car illustration (inline SVG, no image to download) -->
          <div class="car-wrap">
            <svg class="car" viewBox="0 0 360 130" role="img" aria-label="A red learner car with an L plate">
              <ellipse cx="180" cy="122" rx="160" ry="6" fill="#3A0A17" opacity=".18"/>
              <path d="M18 94c0-14 12-20 32-24l42-30c8-6 16-8 30-8h104c14 0 24 4 33 12l28 22c24 4 54 10 56 26v14c0 4-3 6-7 6H26c-5 0-8-2-8-6z" fill="#D0112B"/>
              <polygon points="100,64 120,42 170,42 170,64" fill="#FFD6E4" stroke="#FFD6E4" stroke-width="4" stroke-linejoin="round"/>
              <polygon points="180,42 224,42 232,44 262,64 180,64" fill="#FFD6E4" stroke="#FFD6E4" stroke-width="4" stroke-linejoin="round"/>
              <path d="M175 42v66" stroke="#A50C22" stroke-width="2"/>
              <rect x="186" y="72" width="14" height="3" rx="1.5" fill="#A50C22"/>
              <rect x="146" y="72" width="14" height="3" rx="1.5" fill="#A50C22"/>
              <path d="M334 82h9v10h-6z" fill="#FFF2F6"/>
              <rect x="18" y="82" width="7" height="12" rx="2" fill="#FF6B9D"/>
              <!-- L plate -->
              <g transform="translate(30 70)">
                <rect width="22" height="22" rx="3" fill="#fff" stroke="#3A0A17" stroke-width="1.5"/>
                <path d="M7 5v12h8" fill="none" stroke="#D0112B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
              </g>
              <!-- Wheels -->
              <g transform="translate(92 100)">
                <path d="M-28 0a28 28 0 0 1 56 0z" fill="#3A0A17"/>
                <g class="car__spin"><g class="car__roll">
                  <circle r="22" fill="#1E0409"/><circle r="12" fill="#FFD6E4"/>
                  <path d="M0-12V12M-12 0H12M-8.5-8.5L8.5 8.5M-8.5 8.5L8.5-8.5" stroke="#D0112B" stroke-width="2"/>
                </g></g>
              </g>
              <g transform="translate(276 100)">
                <path d="M-28 0a28 28 0 0 1 56 0z" fill="#3A0A17"/>
                <g class="car__spin"><g class="car__roll">
                  <circle r="22" fill="#1E0409"/><circle r="12" fill="#FFD6E4"/>
                  <path d="M0-12V12M-12 0H12M-8.5-8.5L8.5 8.5M-8.5 8.5L8.5-8.5" stroke="#D0112B" stroke-width="2"/>
                </g></g>
              </g>
            </svg>
          </div>
        </div>
      </div>
      <div class="road" aria-hidden="true"><div class="road__dash"></div></div>
    </section>

    <!-- Numbers -->
    <section class="section section--blush" style="padding-block: clamp(3rem, 6vw, 4.5rem)">
      <div class="wrap">
        <div class="stats" data-render="stats"></div>
      </div>
    </section>

    <!-- Services -->
    <section class="section">
      <div class="wrap">
        <div class="section__head">
          <h2 class="h2" data-bind="home.servicesTitle"></h2>
          <p class="lede" data-bind="home.servicesLead"></p>
        </div>
        <div class="services" data-render="services"></div>
      </div>
    </section>

    <!-- Process -->
    <section class="section section--blush">
      <div class="wrap">
        <div class="section__head">
          <h2 class="h2" data-bind="home.stepsTitle"></h2>
          <p class="lede" data-bind="home.stepsLead"></p>
        </div>
        <ol class="steps" data-render="steps"></ol>
      </div>
    </section>

    <!-- About -->
    <section class="section">
      <div class="wrap about">
        <!-- Replace this illustration with a real photo: <img src="assets/img/annerie.jpg" alt="Annerie Botha, owner and lead instructor"> -->
        <div class="about__media" data-reveal>
          <svg viewBox="0 0 400 440" role="img" aria-label="Illustration of Annerie behind a steering wheel" preserveAspectRatio="xMidYMid slice">
            <rect width="400" height="440" fill="#FFD6E4"/>
            <circle cx="320" cy="90" r="120" fill="#FF6B9D" opacity=".45"/>
            <path d="M60 440c0-86 62-140 140-140s140 54 140 140z" fill="#D0112B"/>
            <rect x="172" y="250" width="56" height="60" rx="22" fill="#F2A98C"/>
            <circle cx="200" cy="205" r="68" fill="#F7BBA1"/>
            <path d="M130 200c0-52 32-82 72-82s70 30 70 82c-14-30-38-44-70-44s-56 14-72 44z" fill="#3A0A17"/>
            <circle cx="177" cy="212" r="5" fill="#3A0A17"/><circle cx="223" cy="212" r="5" fill="#3A0A17"/>
            <path d="M180 240c12 12 28 12 40 0" fill="none" stroke="#A50C22" stroke-width="5" stroke-linecap="round"/>
            <circle cx="200" cy="390" r="92" fill="none" stroke="#3A0A17" stroke-width="14"/>
            <path d="M200 390V300M108 390h184M135 325l130 130" stroke="#3A0A17" stroke-width="10" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="about__text" data-reveal>
          <h2 class="h2" data-bind="about.title"></h2>
          <p data-bind="about.paragraphs.0"></p>
          <p data-bind="about.paragraphs.1"></p>
          <ul class="ticks" data-render="aboutpoints"></ul>
          <div style="margin-top:2rem"><a class="btn" href="contact.html">Book with Annerie's team</a></div>
        </div>
      </div>
    </section>

    <!-- Testimonials -->
    <section class="section section--blush">
      <div class="wrap">
        <div class="section__head">
          <h2 class="h2" data-bind="home.quotesTitle"></h2>
        </div>
        <div data-render="testimonials" data-layout="feature"></div>
        <p style="margin-top:2rem"><a class="btn btn--ghost" href="success-stories.html">Read more success stories</a></p>
      </div>
    </section>

    <!-- Areas -->
    <section class="section">
      <div class="wrap">
        <div class="section__head">
          <h2 class="h2" data-bind="home.areasTitle"></h2>
          <p class="lede" data-bind="home.areasLead"></p>
        </div>
        <ul class="area-list" data-render="areas"></ul>
      </div>
    </section>

    <!-- FAQ -->
    <section class="section section--blush">
      <div class="wrap">
        <div class="section__head">
          <h2 class="h2" data-bind="home.faqTitle"></h2>
        </div>
        <div class="faqs" data-render="faq" data-cat="general"></div>
      </div>
    </section>

    <!-- Call to action -->
    <section class="cta section">
      <div class="wrap">
        <div>
          <h2 data-bind="home.ctaBand.title"></h2>
          <p data-bind="home.ctaBand.text"></p>
        </div>
        <a class="btn btn--white" href="contact.html" data-bind="home.ctaBand.button.label" data-bind-href="home.ctaBand.button.href"></a>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>

</body>
</html>
